<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4e8c" />
  <meta name="description" content="광고 없는 한글(HWP·HWPX) 문서 뷰어" />
  <title>한글 뷰어</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="bar">
    <button id="btn-home" class="icon-btn" aria-label="처음 화면" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <div id="title">한글 뷰어</div>
    <div id="page-ind" hidden></div>
    <button id="btn-zoom-out" class="icon-btn" aria-label="축소" hidden>
      <svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
    </button>
    <button id="btn-zoom-in" class="icon-btn" aria-label="확대" hidden>
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" /></svg>
    </button>
    <button id="btn-open-top" class="icon-btn" aria-label="파일 열기">
      <svg viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v10H4z" /></svg>
    </button>
  </header>

  <main id="home">
    <section class="hero">
      <div class="logo">한</div>
      <h1>한글 문서 뷰어</h1>
      <p>HWP · HWPX 파일을 광고 없이 바로 봅니다.<br />파일은 이 기기 안에서만 열리고 어디로도 보내지 않아요.</p>
      <button id="btn-open" class="primary">파일 열기</button>
      <input id="file-input" type="file" accept=".hwp,.hwpx,application/x-hwp,application/haansofthwp,application/vnd.hancom.hwp,application/vnd.hancom.hwpx" hidden />
    </section>

    <section id="recent-wrap" hidden>
      <h2>최근 문서</h2>
      <ul id="recent"></ul>
    </section>

    <section class="tips">
      <h2>사용 방법</h2>
      <ul>
        <li><b>홈 화면에 추가</b>: 크롬 메뉴(⋮) → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b></li>
        <li>설치 후에는 카카오톡·파일 앱에서 문서를 <b>공유 → 한글 뷰어</b>로 보내면 바로 열려요.</li>
        <li>두 손가락으로 벌려서 확대, 두 번 탭하면 원래 크기로 돌아와요.</li>
      </ul>
    </section>
    <footer id="ver"></footer>
  </main>

  <main id="viewer" hidden>
    <div id="pages"></div>
  </main>

  <div id="overlay" hidden>
    <div class="box">
      <div class="spinner"></div>
      <div id="overlay-msg">문서를 여는 중…</div>
    </div>
  </div>

  <dialog id="pw-dialog">
    <form method="dialog">
      <p>암호가 걸린 문서예요. 암호를 입력하세요.</p>
      <input id="pw-input" type="password" autocomplete="off" />
      <p id="pw-err" class="err" hidden>암호가 맞지 않아요.</p>
      <div class="row">
        <button value="cancel" type="submit">취소</button>
        <button value="ok" type="submit" class="primary">열기</button>
      </div>
    </form>
  </dialog>

  <div id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
